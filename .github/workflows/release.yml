name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser
        version: latest
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

  winget:
    name: Publish to winget
    runs-on: ubuntu-latest
    needs: release
    steps:
    - uses: vedantmgoyal9/winget-releaser@v2
      with:
        identifier: BlackwellSystems.shelfctl
        max-versions-to-keep: 5
        fork-user: blackwell-systems
        token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release
    if: always() && needs.release.result != 'cancelled'
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Download release archives
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        mkdir -p dist/archives
        for suffix in Darwin_x86_64.tar.gz Darwin_arm64.tar.gz Linux_x86_64.tar.gz Linux_arm64.tar.gz Windows_x86_64.zip Windows_arm64.zip; do
          gh release download "${GITHUB_REF_NAME}" \
            --pattern "shelfctl_${VERSION}_${suffix}" \
            --dir dist/archives
        done

    - name: Build platform wheels
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        python python/_build_wheels.py \
          --version "$VERSION" \
          --archives-dir dist/archives \
          --output-dir dist/wheels

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages-dir: dist/wheels/
