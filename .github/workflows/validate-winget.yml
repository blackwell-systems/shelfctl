name: Validate winget manifests

on:
  push:
    paths:
      - 'winget/**'
  pull_request:
    paths:
      - 'winget/**'
  workflow_dispatch:

jobs:
  validate-winget:
    name: Validate winget manifest
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Validate winget manifest
      run: winget validate --manifest winget/
