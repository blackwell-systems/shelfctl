version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/shelfctl
    binary: shelfctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - docs/*

checksum:
  name_template: 'checksums.txt'

brews:
  - repository:
      owner: blackwell-systems
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/blackwell-systems/shelfctl
    description: "Personal library manager for PDFs using GitHub Release assets"
    license: MIT

scoops:
  - repository:
      owner: blackwell-systems
      name: scoop-bucket
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: bucket
    homepage: https://github.com/blackwell-systems/shelfctl
    description: "Personal library manager for PDFs using GitHub Release assets"
    license: MIT

nfpms:
  - id: shelfctl
    package_name: shelfctl
    vendor: Blackwell Systems
    homepage: https://github.com/blackwell-systems/shelfctl
    maintainer: Dayna Blackwell <dayna@blackwellsystems.com>
    description: "Personal library manager for PDFs using GitHub Release assets"
    license: MIT
    formats:
      - deb
      - rpm
    contents:
      - src: README.md
        dst: /usr/share/doc/shelfctl/README.md
      - src: LICENSE
        dst: /usr/share/doc/shelfctl/LICENSE

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - 'typo'

release:
  github:
    owner: blackwell-systems
    name: shelfctl
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## shelfctl {{ .Tag }}

    Organize PDFs and books across GitHub using Release assets instead of git commits.

    ### Installation

    **Homebrew (macOS/Linux)**:
    ```bash
    brew install blackwell-systems/tap/shelfctl
    ```

    **Install script (Linux/macOS)**:
    ```bash
    curl -fsSL https://raw.githubusercontent.com/blackwell-systems/shelfctl/main/install.sh | sh
    ```

    **Go install**:
    ```bash
    go install github.com/blackwell-systems/shelfctl/cmd/shelfctl@{{ .Tag }}
    ```

    **Scoop (Windows)**:
    ```powershell
    scoop bucket add blackwell-systems https://github.com/blackwell-systems/scoop-bucket
    scoop install shelfctl
    ```

    **winget (Windows)**:
    ```powershell
    winget install BlackwellSystems.shelfctl
    ```

    **APT / RPM (Debian, Ubuntu, Fedora, RHEL)**:
    Download the `.deb` or `.rpm` package from the assets below and install with `dpkg -i` or `rpm -i`.

    **Download binary**:
    Download the appropriate binary for your platform below.

  footer: |
    ---

    **Full changelog**: See [CHANGELOG.md](https://github.com/blackwell-systems/shelfctl/blob/{{ .Tag }}/CHANGELOG.md) for complete details.
