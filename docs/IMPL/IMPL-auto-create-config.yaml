title: Auto-create config on first run
feature_slug: auto-create-config
verdict: SUITABLE
suitability_assessment: |
    Suitability gate passed on all five criteria:

    1. File decomposition: 7+ files changing across 3 distinct areas (setup logic,
       config prompting, documentation). Two agents can work with disjoint ownership.
    2. Investigation-first: No unknowns. The missing-config detection points and
       config.Save() path are well-understood from code review.
    3. Interface discoverability: The cross-agent interface is a single function
       (PromptAndCreateConfig) with a clear signature determinable now.
    4. Pre-implementation status: No prior implementation exists for inline config
       prompting. The init_wizard.go handles shelf creation but NOT initial config
       creation. hub_runner.go falls through to runHub() which shows a text message
       but does not prompt for config creation.
    5. Parallelization value: Two agents with 3-4 files each, build/test cycle ~10s.
       Moderate parallelization benefit plus coordination value as audit trail.

    Estimated times:
    - Scout phase: ~8 min (dependency mapping, interface contracts, IMPL doc)
    - Agent execution: ~8 min (2 agents x 8 min avg, Wave 1 parallel + Wave 2 serial)
    - Merge & verification: ~3 min
    Total SAW time: ~19 min

    Sequential baseline: ~20 min (2 agents x 10 min avg sequential time)
    Time savings: ~1 min (5% faster)

    Recommendation: Marginal speed gains but clear coordination value. The code
    changes touch two independent areas (core logic vs docs) making parallel
    execution clean and conflict-free.
