pre_mortem:
    overall_risk: low
    rows:
        - scenario: Agent A's hub_runner.go edit breaks the import block by adding ghclient import incorrectly
          likelihood: low
          impact: medium
          mitigation: Build gate catches immediately. Agent A prompt specifies exact import alias matching root.go pattern.
        - scenario: PromptAndCreateConfig reads from stdin in test environment causing test hang
          likelihood: medium
          impact: medium
          mitigation: Tests only cover non-TTY path (util.IsTTY() returns false in CI). Interactive path tested manually.
        - scenario: Agent B's README edit accidentally removes the --owner flag from other examples beyond quickstart
          likelihood: low
          impact: low
          mitigation: Agent B prompt is scoped to only the 30-Second Quickstart section. Other examples retain --owner as optional.
        - scenario: Race between PersistentPreRunE auto-create and RunE reading cfg
          likelihood: low
          impact: high
          mitigation: Cobra runs PersistentPreRunE synchronously before RunE. No race possible.
