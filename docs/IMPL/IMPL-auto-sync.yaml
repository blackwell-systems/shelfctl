title: Opt-in Auto-Sync for Hub TUI
feature_slug: auto-sync
verdict: SUITABLE
suitability_assessment: |
    All five suitability checks pass cleanly.

    1. File decomposition: 6 distinct files change across 3 logical domains
       (config schema, TUI model orchestration, hub view rendering). Agent A
       owns config (schema.go + schema_test.go + config.go + config.example.yml),
       Agent C owns tui/hub.go (HubContext field addition), Agent B owns
       model.go + sync_all.go (auto-sync logic), Agent E owns unified/hub.go
       (status line rendering), Agent D owns docs. No file is shared between
       agents in the same wave.

    2. No investigation-first items: the trigger points (hubContextLoadedMsg,
       modifiedRefreshTickMsg, modifiedStatusRefreshedMsg) are fully understood
       from reading the codebase. No unknown root cause.

    3. Interface contracts are fully discoverable: SyncConfig struct, debounce
       helper signature, auto-sync trigger message, and HubContext.LastAutoSync
       field are all definable before implementation starts.

    4. Pre-implementation status check: feature does not yet exist anywhere in
       the codebase. No SyncConfig, no auto_sync field, no autoSyncDoneMsg.
       All items are TODO.

    5. Parallelization value: Go build+test cycle is fast (~3s), but agents own
       3-5 files each with non-trivial logic (debounce, phase state machine
       extension, status bar rendering). Two genuinely independent agents (A, C)
       can run in parallel in Wave 1, and two independent agents (B, E) run in
       parallel in Wave 2, saving meaningful iteration time.

    Estimated times:
    - Scout phase: ~20 min
    - Agent execution: Wave 1 ~12 min (2 parallel), Wave 2 ~15 min (2 parallel),
      Wave 3 ~8 min (1 agent)
    - Merge and verification: ~5 min
    Total SAW time: ~60 min

    Sequential baseline: ~70 min (5 agents x ~14 min avg)
    Time savings: ~10 min. Coordination value also significant: the IMPL doc
    defines the cross-agent interfaces (SyncConfig, LastAutoSync, autoSyncDoneMsg)
    preventing duplicate type declarations.
