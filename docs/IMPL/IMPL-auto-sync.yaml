interface_contracts:
    - name: SyncConfig
      description: |
        New top-level config struct for sync settings. Added as the Sync field
        on Config. Viper defaults: auto_sync=false, debounce_minutes=5.
      definition: |
        // SyncConfig holds settings for automatic background sync.
        type SyncConfig struct {
            AutoSync        bool `mapstructure:"auto_sync"`
            DebounceMinutes int  `mapstructure:"debounce_minutes"`
        }

        // In Config struct, add after Migration MigrationConfig field:
        Sync SyncConfig `mapstructure:"sync"`
      location: internal/config/schema.go
    - name: HubContext.LastAutoSync
      description: |
        New fields on HubContext tracking when auto-sync last ran and how many
        books were synced. Zero value (nil Time, 0 count) means "never ran".
        Written by model.go (Agent B) and read by unified/hub.go (Agent E).
      definition: |
        // In HubContext struct (internal/tui/hub.go), add after Version string:
        LastAutoSyncAt    *time.Time // nil if never ran this session
        LastAutoSyncCount int        // number of books synced in last auto-sync run
      location: internal/tui/hub.go
    - name: autoSyncDoneMsg
      description: |
        Message emitted by the headless SyncAllModel when auto-sync completes.
        Defined in model.go and consumed in the same file's Update switch.
      definition: |
        // autoSyncDoneMsg is emitted when a background auto-sync run finishes.
        type autoSyncDoneMsg struct {
            synced int
            errors int
        }
      location: internal/unified/model.go
    - name: NewSyncAllModelAuto
      description: |
        Constructor for SyncAllModel that skips the confirmation phase and
        starts processing immediately using a pre-detected book list.
      definition: |
        func NewSyncAllModelAuto(gh *github.Client, cfg *config.Config,
            cacheMgr *cache.Manager, books []syncEntry) SyncAllModel
      location: internal/unified/sync_all.go
    - name: withinDebounce
      description: |
        Package-private helper in model.go. Returns true if the file at path
        was last modified within debounceMins minutes of now.
      definition: |
        func withinDebounce(path string, debounceMins int) bool
      location: internal/unified/model.go
