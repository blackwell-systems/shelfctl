pre_mortem:
    overall_risk: medium
    rows:
        - scenario: |
            Agent E modifies internal/unified/hub.go while Agent B also modifies it
            through a misread of the ownership table.
          likelihood: low
          impact: high
          mitigation: |
            File ownership is explicitly disjoint: Agent B owns model.go and
            sync_all.go; Agent E owns hub.go. Both agent prompts contain explicit
            "Do NOT modify" constraints listing each other's files.
        - scenario: |
            Agent B's headless forwarding block is incomplete — spinner.TickMsg or
            progress.FrameMsg is missing from the type switch, causing the headless
            upload to stall mid-file.
          likelihood: medium
          impact: medium
          mitigation: |
            The agent prompt explicitly lists all six message types to forward.
            The postcondition check verifies structure; a manual test with a real
            modified book will expose stalls. The autoMode guard also prevents
            re-triggering on a stalled run.
        - scenario: |
            After autoSyncDoneMsg fires and refreshModifiedStatusCmd is called,
            the just-synced books still show as modified (catalog SHA not yet
            updated in catalogCache), causing an immediate second auto-sync run.
          likelihood: medium
          impact: medium
          mitigation: |
            The catalogCache is only updated from loadHubContextAsync (network
            fetch). After auto-sync the catalog SHA on GitHub is updated, but
            catalogCache still holds the old SHA. The synced book will temporarily
            remain "modified" locally until the next full hub load. This is
            acceptable — the next modifiedRefreshTickMsg will fire within 20 seconds
            and find the catalog has caught up if the hub re-loads; or the user will
            see "↑ Auto-synced N book(s)" acknowledging completion. A guard
            `!m.syncAll.autoMode` in the pendingAutoSync trigger prevents a tight
            re-sync loop within the same scan cycle.
        - scenario: |
            Agent C adds *time.Time field to HubContext but forgets the "time" import,
            causing a compile failure in internal/tui.
          likelihood: medium
          impact: low
          mitigation: |
            Agent C's prompt explicitly shows the current import block and instructs
            adding "time". Verification gate runs go build ./internal/tui/...
            immediately, surfacing this before merge.
        - scenario: |
            syncComputeHash is called inside refreshModifiedStatusCmd (model.go)
            but syncComputeHash is defined in sync_all.go. If these were in different
            packages this would fail, but both are in package unified so the call
            is valid.
          likelihood: low
          impact: low
          mitigation: |
            Both files are in package unified. Go resolves cross-file calls within
            a package at compile time. Agent B prompt notes this explicitly.
