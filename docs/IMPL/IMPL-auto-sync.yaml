            ```

            **2. `docs/guides/hub.md`**

            Find the existing "Sync Modified" section (search for `sync-modified`
            or `Sync Modified` in the file). Add a new "### Auto-Sync" subsection
            after the Sync Modified description block. Insert after the relevant
            section:

            ```markdown
            ### Auto-Sync (opt-in)

            When `sync.auto_sync: true` is set in your config, the hub will
            automatically upload modified books in the background without a
            confirmation prompt.

            **How it works:**
            - After the hub loads (and on each 20-second background scan), shelfctl
              checks for locally modified cached books.
            - Any book whose cache file was modified more than `sync.debounce_minutes`
              minutes ago (default: 5) is queued for upload.
            - Files modified within the debounce window are skipped and reconsidered
              on the next scan.
            - After syncing, the hub shows: `↑ Auto-synced N book(s)`

            **Enable auto-sync in your config:**
            ```yaml
            sync:
              auto_sync: true
              debounce_minutes: 5  # optional, default is 5
            ```

            **When to use it:** Best for workflows where you frequently annotate
            PDFs and want changes pushed automatically.

            **When NOT to use it:** Leave `auto_sync: false` (the default) if you
            want explicit control over when files are uploaded.
            ```

            **3. `docs/reference/commands.md`**

            Find the config reference section for `defaults`. After the defaults
            section, add a `sync` subsection. Search the file for `cache_dir` or
            `asset_naming` to locate where the defaults config block ends, then
            insert after it:

            ```markdown
            #### `sync`

            | Field | Type | Default | Description |
            |-------|------|---------|-------------|
            | `sync.auto_sync` | bool | `false` | When `true`, automatically upload modified books from the hub without confirmation. |
            | `sync.debounce_minutes` | int | `5` | Skip files modified within this many minutes (avoids uploading files still being written). |

            **Example:**
            ```yaml
            sync:
              auto_sync: true
              debounce_minutes: 10
            ```
            ```

