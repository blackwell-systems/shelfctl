title: High-priority code quality and UX fixes
feature_slug: code-quality-ux-fixes
verdict: SUITABLE
suitability_assessment: |
    Suitability gate analysis:

    1. File decomposition: 6 independent issues touching distinct file sets across
       internal/github/, internal/app/, internal/unified/, internal/util/, and
       internal/catalog/. Only Issue 6 (deduplication) shares files with other
       issues at call sites, but the actual implementation files are disjoint.
       Clear decomposition into 5+ agents with disjoint file ownership.

    2. Investigation-first items: None. All issues have known root causes and
       documented fixes. No debugging or reproduction needed.

    3. Interface discoverability: Yes. The new shared utility functions
       (humanBytes, openFile, isPDF, computeFileHash) have existing signatures
       that just need to be moved. The GitHub error types already exist in
       errors.go. The GIT_ASKPASS pattern is well-documented.

    4. Pre-implementation status: All 6 issues are TODO. No partial implementations.

    5. Parallelization value: High. 5 independent agents in wave 1 touching
       distinct files. Build/test cycle is ~5s but there are 5 parallel agents
       with 3-8 files each. Clear speedup over sequential.

    Estimated times:
    - Scout phase: ~8 min
    - Agent execution: ~5 min (5 agents in wave 1 parallel, 1 agent in wave 2)
    - Merge and verification: ~3 min
    Total SAW time: ~16 min

    Sequential baseline: ~30 min (6 issues x ~5 min avg)
    Time savings: ~14 min (47% faster)

    Recommendation: Clear speedup. Proceed.
