            ## Agent A: GitHub client error wrapping (Issue 1)

            ### What to implement

            Improve the GitHub HTTP client error handling so users see actionable
            error messages instead of raw HTTP status codes.

            **File 1: internal/github/errors.go**

            Update the existing sentinel error messages to be user-friendly:

            Replace the current error definitions:
            ```go
            // ErrNotFound is returned when a resource does not exist.
            ErrNotFound = errors.New("not found")
            // ErrUnauthorized is returned when authentication fails.
            ErrUnauthorized = errors.New("unauthorized — check your GitHub token")
            // ErrForbidden is returned when authorization fails.
            ErrForbidden = errors.New("forbidden — token may lack required scope (needs 'repo')")
            // ErrConflict is returned when a resource already exists.
            ErrConflict = errors.New("conflict — resource already exists")
            ```

            With enhanced messages:
            ```go
            ErrNotFound      = errors.New("not found")
            ErrUnauthorized  = errors.New("authentication failed: check that SHELFCTL_GITHUB_TOKEN is set and valid")
            ErrForbidden     = errors.New("permission denied: ensure your token has 'repo' scope for private repos, or 'public_repo' for public")
            ErrConflict      = errors.New("conflict: resource already exists")
            ErrRateLimited   = errors.New("GitHub API rate limit exceeded: wait and try again, or check usage at api.github.com/rate_limit")
            ErrServerError   = errors.New("GitHub API error: try again later")
            ```

            **File 2: internal/github/client.go**

            Update `checkStatus` to handle 429 (rate limit) and 500+ (server errors):

            Replace the current `checkStatus` function. The current default case is:
            ```go
            default:
            	return fmt.Errorf("github API error %d", resp.StatusCode)
            ```

            Add cases for 429 and a range for 500+:
            ```go
            case http.StatusTooManyRequests:
            	return ErrRateLimited
            ```
            And update the default case to return `ErrServerError` for 5xx codes,
            keeping the generic formatted error for other unexpected codes.

            Update the `do` method to wrap connection/timeout errors:
            After `c.http.Do(req)`, if err is non-nil, wrap it with a user-friendly
            message like "unable to reach GitHub API: check your internet connection: %w".
            Use `errors.Is(err, context.DeadlineExceeded)` or check for `net.Error` timeout
            to differentiate timeout vs connectivity errors.

            **File 3: internal/github/client_test.go**

            Add tests for:
            - `checkStatus` returning `ErrRateLimited` for 429
            - `checkStatus` returning `ErrServerError` for 500, 502, 503
            - `do` wrapping connection errors with user-friendly message
            - Existing tests for 401, 403, 404 still pass with new error messages
              (update expected error strings in TestCheckStatus_Unauthorized etc.)

            ### Interface contracts
            - ErrRateLimited: new sentinel in errors.go
            - ErrServerError: new sentinel in errors.go
            - ErrUnauthorized, ErrForbidden: updated messages (callers use errors.Is, not string match)
            - ErrNotFound: message unchanged ("not found")

