            ## Agent C: Secure credential passing for git (Issue 4)

            ### What to implement

            In `internal/github/gitops.go`, the GitHub token is embedded directly
            in the clone URL passed as a CLI argument to git:

            ```go
            cloneURL := fmt.Sprintf("https://x-access-token:%s@github.com/%s/%s.git",
            	c.token, owner, repo)
            ```

            This is visible in `/proc/<pid>/cmdline` on Linux. Replace with a
            GIT_ASKPASS approach that passes the token via environment variable
            to a helper script.

            **Implementation approach:**

            1. Create a temporary GIT_ASKPASS script that echoes the token from
               an environment variable. The script content:
               ```
               #!/bin/sh
               echo "$SHELFCTL_GIT_PASSWORD"
               ```

            2. Update `CommitFile` to:
               - Write the askpass script to a temp file with mode 0700
               - Use a plain HTTPS clone URL: `https://github.com/{owner}/{repo}.git`
               - Pass the token via environment variable to `runGit`

            3. Update `runGit` to accept optional environment variables.
               Change the signature to accept env vars:
               ```go
               func runGit(dir string, env []string, args ...string) error
               ```
               Or alternatively, create a `runGitWithEnv` variant.

               Set these env vars on the git command:
               ```go
               cmd.Env = append(os.Environ(), env...)
               ```

            4. The askpass env vars needed:
               ```
               GIT_ASKPASS=/path/to/temp/askpass-script
               SHELFCTL_GIT_PASSWORD=<token>
               GIT_TERMINAL_PROMPT=0
               ```

            5. Clean up the askpass script in defer after CommitFile completes.

            6. Update the `sanitize` function — it may no longer need the token
               URL pattern since the token is no longer in the URL. Keep it for
               backward safety but the primary leak vector is eliminated.

            **Update gitops_test.go:**
