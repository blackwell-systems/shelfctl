            ### File to create
            `internal/app/doctor_test.go`

            ### Testing strategy

            The test file is in `package app` (same package as production code), giving access to
            unexported helpers. Tests use `bytes.Buffer` for capturing output and temp directories
            plus `t.Setenv` for environment variable isolation.

            For API-dependent checks, use `net/http/httptest` directly — do NOT use the `mockserver`
