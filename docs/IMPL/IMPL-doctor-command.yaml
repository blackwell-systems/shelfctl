          task: |-
            ## Agent B — Doctor Command Tests

            Write tests for the `shelfctl doctor` command.

            ### Prerequisite
            Wave 1 Agent A has implemented:
            - `internal/app/doctor.go` — `runDoctor(w io.Writer) (bool, error)`, `CheckResult` struct,
              `checkConfig`, `checkToken`, `checkAPIAndScopes`, `checkShelf`, `checkCache`.
