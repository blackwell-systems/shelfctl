    - title: False-positive cascade errors from finalize-scout
      description: |
        sawtools check-test-cascade searches agent task prose as literal symbol names,
        causing tokens like "}", "context", and "net/http" to match test file lines.
        These are tool artifacts. The real cascade (ScanRepo signature change) has been
        addressed by adding scan_test.go, migrate.go, and import_repo_ops.go to Agent K
        ownership.
    - title: E35 gap for BookItem addressed
      description: |
        Pre-wave validation flagged a gap for BookItem in book_item.go (Agent C owns that
        file). Agent C is only deleting the private helper formatBytes; BookItem struct and
        its callers are unchanged. The test files book_picker_test.go and list_browser_test.go
        have been added to Agent C's ownership so the agent can verify the tests still pass
        after the formatBytes removal.
    - title: Wave ordering fix — GetFileContent public signature preserved
      description: |
        Pre-wave validation reported that Agent J (Wave 3) was changing GetFileContent's
        signature (adding context.Context) while callers in Wave 1 files (internal/app/shelve.go,
        internal/unified/model.go) and Wave 2 files (internal/unified/sync_all.go,
        internal/app/cache.go) use the old signature. Fix: Agent J now uses a
        backward-compat wrapper approach. GetFileContent keeps its existing 4-param signature
        unchanged; the new GetFileContentCtx method carries the context. All existing callers
        in Wave 1/2 files continue to compile without modification.
    - title: Test cascade gaps resolved
      description: |
        Pre-wave validation identified two test cascade gaps. Both resolved:
        - test/mockserver/server_test.go added to Agent K (Wave 3) ownership.
        - internal/app/migrate_test.go added to Agent A (Wave 1) ownership.
    - title: 'False positive: catalogPath wave_structure symbol warning'
      description: |
        The wave_structure check flags `catalogPath` as a potential cross-agent dependency
        because the name appears in both internal/app/shelve.go (Agent A) and
        internal/unified/model.go (Agent B). This is a false positive.
        In shelve.go, `catalogPath` is a local parameter of the `updateCatalog` function
        being deleted by Agent A. In model.go, `catalogPath` is an unrelated local variable
        inside a different function. The two symbols share only a name; there is no actual
        dependency, import relationship, or shared type between them. No action required.
