pre_mortem:
    overall_risk: medium
    rows:
        - scenario: |-
            Agent F's cache path change (owner segment) is a breaking change to the on-disk
            layout. Existing users' caches at the old path (<baseDir>/<repo>/<asset>) will no
            longer be found, causing re-downloads on first use after upgrade.
          likelihood: high
          impact: medium
          mitigation: |-
            Accept as a one-time migration cost — the old layout was buggy (owner collision).
            Document in CHANGELOG. Do NOT add migration code in this IMPL; it adds scope.
            The fix is correct; the disruption is one-time.
        - scenario: |-
            Agent J adds context support to GetFileContent internals. If the backward-compat
            wrapper (GetFileContent delegating to GetFileContentCtx) is not implemented
            correctly, or if Agent J accidentally changes the public GetFileContent signature,
            all callers in Wave 1/2 files will fail to compile.
          likelihood: low
          impact: high
          mitigation: |-
            Agent J task has an explicit CRITICAL constraint: do NOT change the public
            GetFileContent(owner, repo, path, ref string) signature. The verification gate
            includes `grep` to confirm the wrapper (4-param, no ctx) still exists, and
            `go build ./...` catches any cross-package compile errors immediately.
        - scenario: |-
            Agent K refactors migrate/scan.go's ScanRepo signature. If callers in other files
            (e.g., internal/migrate/migrate.go) are missed, compilation fails.
          likelihood: medium
          impact: medium
          mitigation: |-
            Agent K must grep ALL callers before and after. The verification gate includes
            `go build ./...` which catches cross-package compile errors.
        - scenario: |-
            Agent I deletes browserDownloader from app/browse.go but misses the progressReader
            type, leaving the file referencing a deleted type.
          likelihood: medium
          impact: low
          mitigation: |-
            Agent I task explicitly calls out progressReader deletion. The build gate
            `go build ./internal/app/...` catches this immediately.
        - scenario: |-
            Agent H updates cacheMgr.Path("","","","") in model.go but BuildContext (being
            deleted by Wave 1 Agent B) is still present in Agent H's worktree. Agent H
            must handle this conditionally per the task instructions.
          likelihood: medium
          impact: low
          mitigation: |-
            Agent H task explicitly addresses this: "if BuildContext still exists in your
            worktree, update it; if deleted, skip." Build gate catches missed cases.
        - scenario: |-
            Wave 4 tests for internal/unified require mocking github.Client. If the mock
            doesn't implement the full interface, compilation fails.
          likelihood: medium
          impact: low
          mitigation: |-
            Agent M task points to existing fakeGitHubClient in browse_test.go as a pattern.
            Use a minimal interface embedding only the needed methods.
