            }
            ```
            Fix: include the owner segment so the layout becomes `<baseDir>/<owner>/<repo>/<asset>`.

            `EnsureDir` has the same bug — it only creates `<baseDir>/<repo>`:
            ```go
            func (m *Manager) EnsureDir(owner, repo, bookID string) error {
            	dir := filepath.Join(m.baseDir, repo)
            	return os.MkdirAll(dir, 0750)
            }
