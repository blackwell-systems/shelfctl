interface_contracts:
    - name: cache.Manager.Path
      description: |-
        After M1 fix, Path includes owner segment to prevent cross-owner collisions.
        Callers that passed empty strings to get baseDir must switch to BaseDir().
      definition: |-
        // Path returns <baseDir>/<owner>/<repo>/<assetFilename>
        func (m *Manager) Path(owner, repo, bookID, assetFilename string) string
      location: internal/cache/paths.go
    - name: cache.Manager.EnsureDir
      description: EnsureDir must be updated to match the new owner-scoped directory structure.
      definition: |-
        // EnsureDir creates <baseDir>/<owner>/<repo>/
        func (m *Manager) EnsureDir(owner, repo, bookID string) error
      location: internal/cache/paths.go
    - name: browserDownloader (consolidated)
      description: |-
        After H3 consolidation, internal/app/browse.go's browserDownloader is deleted.
        internal/unified/browse.go remains the canonical implementation.
        internal/app/browse.go creates a unified.BrowserDownloader directly (cross-package
        access requires the type to be exported, or app creates its own thin wrapper that
        delegates). Preferred approach: keep unexported in each package but extract the
        shared Download/DownloadWithProgress/Sync logic into a shared helper in
        internal/app/download.go (see M5 below).
      definition: |-
        // Both browserDownloader implementations are identical.
        // The fix removes the copy in internal/app/browse.go and has it construct
        // a unified.BrowserDownloader{gh, cache} directly via a constructor.
        // unified.browserDownloader remains unexported; NewBrowseModel is the entry point.
        // internal/app/browse.go passes gh and cacheMgr to unified.NewBrowseModel.
      location: internal/unified/browse.go
    - name: Download-then-open shared helper
      description: |-
        M5 extraction target. The pattern of (get release -> find asset -> download rc ->
        show progress -> store in cache) is repeated in open.go, browse.go (handleBrowserAction),
        and unified/model.go (handleOpenBook). Extract to internal/app/download.go.
      definition: |-
        // DownloadBook downloads a book asset to the local cache, showing a progress bar
        // if a TTY is available. Returns the local cache path on success.
        // Defined in internal/app/download.go (package app).
        func DownloadBook(
            gh *github.Client,
            cacheMgr *cache.Manager,
            owner, repo string,
            book *catalog.Book,
            useTUI bool,
        ) (string, error)
      location: internal/app/download.go
    - name: github.Client context-aware methods
      description: |-
        M3 (partial): HTTP calls in internal/github need context propagation for cancellation.
        The primary do() helper and doJSON gain context parameters internally. IMPORTANT:
        GetFileContent keeps its existing public signature unchanged to avoid a wave-ordering
        cascade. Context is threaded at the HTTP layer internally via backward-compat wrappers.
        The new ctx-aware variant is exposed as GetFileContentCtx for callers that already
        hold a context; existing callers continue to use GetFileContent with no changes needed.
      definition: |-
        // doJSON gains a ctx parameter; existing callers pass context.Background() as default.
        func (c *Client) doJSON(ctx context.Context, method, url string, body, out interface{}) error

        // GetFileContent keeps its existing signature — no change to public API.
        func (c *Client) GetFileContent(owner, repo, path, ref string) ([]byte, string, error)

        // GetFileContentCtx is the new context-aware variant for callers that hold a context.
        func (c *Client) GetFileContentCtx(ctx context.Context, owner, repo, path, ref string) ([]byte, string, error)

        // getRawBlob gains ctx internally; not a public API change.
        func (c *Client) getRawBlob(ctx context.Context, owner, repo, sha string) ([]byte, error)
      location: internal/github/client.go
